# Atlas AI Model Router Configuration
# Note: Per Gemini API standards, gemini-3.8-flash replaces legacy gemini-2.5-flash,
# and gemini-4-argon replaces legacy gemini-2.5-pro / gemini-3.1-pro-preview.

version: "1.0"

pricing_per_1k_tokens_usd:
  gemini-3.8-flash:
    input: 0.00015
    output: 0.00060
  gemini-3.5-flash-lite:
    input: 0.000075
    output: 0.00030
  gemini-4-argon:
    input: 0.00125
    output: 0.00500

defaults:
  provider: gemini
  model: gemini-3.8-flash
  temperature: 0.2
  max_tokens: 4096
  fallback: gemini-3.5-flash-lite
  prompt_version: "v1.0"

agents:
  # Executive & Core Reasoning (low temperature: 0.2)
  atlas:
    provider: gemini
    model: gemini-3.8-flash
    temperature: 0.2
    max_tokens: 4096
    fallback: gemini-3.5-flash-lite
    prompt_version: "v1.0"

  atlas_escalation:
    provider: gemini
    model: gemini-4-argon
    temperature: 0.2
    max_tokens: 32768
    fallback: gemini-3.8-flash
    prompt_version: "v1.0"

  strategy_review:
    provider: gemini
    model: gemini-4-argon
    temperature: 0.3
    max_tokens: 32768
    fallback: gemini-3.8-flash
    prompt_version: "v1.0"

  # Independent Control Agents (low temperature: 0.2)
  risk:
    provider: gemini
    model: gemini-3.8-flash
    temperature: 0.2
    max_tokens: 4096
    fallback: gemini-3.5-flash-lite
    prompt_version: "v1.0"

  security:
